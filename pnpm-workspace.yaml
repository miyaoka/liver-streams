packages:
  - apps/*
  - packages/*
allowBuilds:
  lefthook: true
  unrs-resolver: true
  workerd: true

catalog:
  "@happy-dom/global-registrator": 20.14.6
  "@tsconfig/node24": 24.0.5
  "@types/bun": 1.4.2
  "@types/node": 24.19.1
  eslint: 10.12.0
  eslint-plugin-import-x: 4.17.1
  eslint-plugin-unused-imports: 4.4.1
  # compiler API を使う tooling（vue-tsc / typescript-eslint / unplugin-dts）のため 6 系に置く
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  unplugin-dts: 1.1.2
  vite: 8.3.4

minimumReleaseAgeExclude:
  - "@miyaoka/eslint-plugin-barrel-import"
  - "@miyaoka/vite-plugin-doc-block"
