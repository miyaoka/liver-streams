packages:
  - apps/*
  - packages/*
allowBuilds:
  lefthook: true
  unrs-resolver: true
  workerd: true

catalog:
  "@happy-dom/global-registrator": 21.0.4
  "@tsconfig/node24": 24.0.6
  "@types/bun": 1.4.4
  "@types/node": 24.19.2
  eslint: 10.15.0
  eslint-plugin-import-x: 4.18.1
  eslint-plugin-unused-imports: 4.4.1
  # TS7 は programmatic API を持たないため、compiler API を使う道具向けに TS6 API を
  # 再エクスポートする互換 package を置く。使うのは apps/web の ESLint の設定
  # （@vue/eslint-config-typescript）と、packages の .d.ts を作る unplugin-dts（peer）
  typescript: npm:@typescript/typescript6@6.0.2
  unplugin-dts: 1.1.2
  vite: 8.3.8

catalogs:
  # .vue を含む tsconfig の型検査。tsrs（TypeScript 7.1 の Rust 移植）が contentMappers で
  # vize を呼び、.vue を TS に写して検査する。.vue を含まない tsconfig は bun check で検査する
  vize:
    tsrs: 7.1.0-beta.tsrs2
    vize: 0.778.0

minimumReleaseAgeExclude:
  - "@miyaoka/eslint-plugin-barrel-import"
  - "@miyaoka/vite-plugin-doc-block"
